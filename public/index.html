<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>버스명당 — 버스 좌석 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#101A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="버스명당">
</head>
<body>
<div class="modal-overlay hidden" id="noticeModal">
  <div class="modal-card">
    <p class="modal-title">버스명당 사용법</p>
    <p>도시·노선(또는 고속/시외 터미널)과 타는 곳·내리는 곳, 날짜·시각을 넣으면 햇빛을 덜 받는 좌석을 알려드려요.</p>
    <p>이 앱은 공공데이터(국가대중교통정보센터)를 기반으로 만들어졌습니다. 공공데이터 특성상 일부 노선의 배차 정보가 비어 있을 수 있습니다.</p>
    <button id="noticeOk" type="button">확인</button>
  </div>
</div>
<div class="app">

  <div class="hd">
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="var(--ink)"/><path d="M256 96a160 160 0 0 0 0 320z" fill="var(--sun)"/><path d="M256 96a160 160 0 0 1 0 320z" fill="var(--shade)"/></svg>
    <div class="hdtxt">
      <span class="title">버스명당</span>
      <span class="tag">버스 좌석 추천</span>
    </div>
  </div>

  <div class="panel">
    <div class="modetabs" role="tablist">
      <button type="button" class="modetab on" id="modeCity" role="tab" aria-selected="true">시내·광역</button>
      <button type="button" class="modetab" id="modeExp" role="tab" aria-selected="false">고속</button>
      <button type="button" class="modetab" id="modeSuburbs" role="tab" aria-selected="false">시외</button>
    </div>

    <div id="cityFields">
      <div class="fld">
        <label>도시</label>
        <select id="city"></select>
      </div>
      <div class="fld">
        <label>노선번호</label>
        <div class="searchrow">
          <input type="text" id="routeNo" placeholder="예: 400, 8873, 도봉07">
          <button id="btnSearch" type="button">검색</button>
        </div>
      </div>
      <div class="fld">
        <label>노선</label>
        <select id="route"></select>
      </div>
      <div class="two">
        <div class="fld"><label>타는 곳</label><select id="from"></select></div>
        <div class="fld"><label>내리는 곳</label><select id="to"></select></div>
      </div>
      <div class="two">
        <div class="fld"><label>날짜</label><input type="date" id="date"></div>
        <div class="fld"><label>승차 시각</label><input type="time" id="time" step="300"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:2px">
        <button class="nowbtn" id="btnNow">지금</button>
        <button class="nowbtn" id="btn16">오후 4시</button>
        <button class="nowbtn" id="btn8">오전 8시</button>
      </div>
    </div>

    <div id="expressFields" class="hidden">
      <div class="fld">
        <label>출발 터미널</label>
        <div class="searchrow">
          <input type="text" id="expDepKeyword" placeholder="예: 센트럴시티, 동서울">
          <button id="btnExpDepSearch" type="button">검색</button>
        </div>
      </div>
      <div class="fld"><select id="expDepTerminal"></select></div>
      <div class="fld">
        <label>도착 터미널</label>
        <div class="searchrow">
          <input type="text" id="expArrKeyword" placeholder="예: 부산, 대전복합">
          <button id="btnExpArrSearch" type="button">검색</button>
        </div>
      </div>
      <div class="fld"><select id="expArrTerminal"></select></div>
      <div class="fld">
        <label>날짜</label>
        <div class="searchrow">
          <input type="date" id="expDate">
          <button id="btnExpSchedule" type="button">배차 조회</button>
        </div>
      </div>
      <div class="fld">
        <label>배차</label>
        <select id="expSchedule"></select>
      </div>
    </div>

    <button class="go" id="btnGo">자리 찾기</button>
    <div class="status mono" id="status" role="status" aria-live="polite"></div>
  </div>

  <div id="result" class="hidden">
    <div class="verdict">
      <div class="k" id="vk">추천 좌석</div>
      <div class="big" id="vbig"></div>
      <div class="sm" id="vsm"></div>
    </div>

    <div class="stage">
      <svg id="seat" viewBox="0 0 400 380" role="img" aria-label="선택한 구간의 태양 위치와 좌석 배치"></svg>
      <div class="cap" id="seatCap"></div>
    </div>

    <div class="sec-t">정류장별 햇빛</div>
    <div class="tl">
      <div class="tlhead"><span class="l">← 왼쪽</span><span class="c">구간</span><span class="r">오른쪽 →</span></div>
      <div id="timeline"></div>
    </div>

    <div class="foot" id="foot"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
